[project]
name = "rsi-sandbox"
version = "0.1.0"
description = "A long-horizon self-improvement sandbox where tasks, verifiers and agents co-evolve and every generation is audited for hacking."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.50"]
report = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
